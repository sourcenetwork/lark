# Configuration for cargo-deny. See https://embarkstudios.github.io/cargo-deny/
# for the full schema.
#
# Lark ships under `Apache-2.0 OR MIT` so any dependency that uses a
# weakly-copyleft or proprietary license would force consumers of
# the crate into a compatibility headache. The allow-list below is
# the conventional FOSS set plus `Unicode-*` variants that unicode-ident
# and friends ship with.

[advisories]
# Fail on any active RUSTSEC advisory for a dependency in the
# lockfile. Yanked crates also produce warnings via cargo's own
# resolver; `cargo deny` surfaces them here so they're one
# consolidated signal.
yanked = "warn"
ignore = []

[licenses]
# Only allow licenses we've vetted as compatible with our
# `Apache-2.0 OR MIT` crate license. Anything outside this set
# blocks the CI job until either the dependency is dropped or
# this list is deliberately widened.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-3-Clause",
    "BSL-1.0",
    "Zlib",
    "Unicode-3.0",
]
confidence-threshold = 0.8

[bans]
# Duplicate versions of the same crate bloat the binary without
# obvious benefit; warn so we notice when a new dependency pulls
# in an older copy of something we already have.
multiple-versions = "warn"
# Wildcard version requirements are a footgun — they float the
# tree in ways the lockfile can't constrain. Allow them
# internally (for path dependencies) but warn on external crates.
wildcards = "allow"

[sources]
# Only trust crates.io. Git and local registries require an
# explicit allow entry to land.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
