# Configuration for cargo-deny. See https://embarkstudios.github.io/cargo-deny/
# for the full schema.
#
# Lark ships under `Apache-2.0 OR MIT` so any dependency that uses a
# weakly-copyleft or proprietary license would force consumers of
# the crate into a compatibility headache. The allow-list below is
# the conventional FOSS set plus `Unicode-*` variants that unicode-ident
# and friends ship with.

[advisories]
# Fail on any active RUSTSEC advisory for a dependency in the
# lockfile. Yanked crates also produce warnings via cargo's own
# resolver; `cargo deny` surfaces them here so they're one
# consolidated signal.
yanked = "warn"
ignore = [
    # RUSTSEC-2026-0253: `LruCache::pop()` is not panic-safe. The
    # documented precondition is a key type whose `Drop` can panic:
    # the node is freed from the map while still linked, and a later
    # eviction walks the dangling pointer.
    #
    # This cache cannot reach it. `block_cache::CacheKey` is a `Copy`
    # struct of two `u64`s, and a `Copy` type cannot implement `Drop`,
    # so `pop()` has no destructor to run and nothing to unwind
    # through. `block_cache.rs` asserts that at compile time, so the
    # ignore fails to build rather than rotting if the key ever gains
    # a field with a destructor.
    #
    # The fix is `lru` 0.18.2, which pulls `hashbrown` 0.17 and with it
    # edition2024, so taking it would raise this crate MSRV from 1.82
    # to 1.85. That is a user-facing promise, so it is not changed
    # here. Later in this stack the block cache stops using `lru`
    # entirely and the ignore goes with it.
    { id = "RUSTSEC-2026-0253", reason = "unreachable: the cache key is Copy, so pop() runs no destructor" },
]

[licenses]
# Only allow licenses we've vetted as compatible with our
# `Apache-2.0 OR MIT` crate license. Anything outside this set
# blocks the CI job until either the dependency is dropped or
# this list is deliberately widened.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-3-Clause",
    "BSL-1.0",
    "Zlib",
    "Unicode-3.0",
]
confidence-threshold = 0.8

[bans]
# Duplicate versions of the same crate bloat the binary without
# obvious benefit. Keep this as a CI gate so dependency drift is
# resolved deliberately instead of accumulating in the lockfile.
multiple-versions = "deny"
# Wildcard version requirements are a footgun — they float the
# tree in ways the lockfile can't constrain. Allow them
# internally (for path dependencies) but warn on external crates.
wildcards = "allow"

[sources]
# Only trust crates.io. Git and local registries require an
# explicit allow entry to land.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
