[package]
name = "lark-kv-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
tempfile = "3.8"

[dependencies.lark-kv]
path = ".."
features = ["fuzzing"]

[workspace]
members = ["."]

[[bin]]
name = "fuzz_api_ops"
path = "fuzz_targets/fuzz_api_ops.rs"
doc = false

[[bin]]
name = "fuzz_writebatch"
path = "fuzz_targets/fuzz_writebatch.rs"
doc = false

[[bin]]
name = "fuzz_block_decoder"
path = "fuzz_targets/fuzz_block_decoder.rs"
doc = false

[[bin]]
name = "fuzz_range_tombstone_decoder"
path = "fuzz_targets/fuzz_range_tombstone_decoder.rs"
doc = false

[[bin]]
name = "fuzz_wal_decoder"
path = "fuzz_targets/fuzz_wal_decoder.rs"
doc = false

[[bin]]
name = "fuzz_manifest_decoder"
path = "fuzz_targets/fuzz_manifest_decoder.rs"
doc = false

[[bin]]
name = "fuzz_sst_decoder"
path = "fuzz_targets/fuzz_sst_decoder.rs"
doc = false
