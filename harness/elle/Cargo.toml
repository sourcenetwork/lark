[package]
name = "elle-harness"
version = "0.1.0"
publish = false
edition = "2024"
rust-version = "1.90"
description = "Jepsen/Elle consistency harness for the regolith storage engine"

# Detaches this crate from the regolith workspace so `cargo check --workspace`
# at the repository root never builds it, exactly like fuzz/ does.
[workspace]
members = ["."]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dependencies.regolith]
path = "../.."

[[bin]]
name = "elle-gen"
path = "src/main.rs"

[profile.release]
opt-level = 3
