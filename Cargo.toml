[workspace]
members = [".", "tools/lark-bench", "tools/lark-stress", "tools/lark-ycsb"]
resolver = "2"

[package]
name = "lark-kv"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0 OR MIT"
description = "A pure Rust, embedded LSM-tree key-value store built from scratch"
repository = "https://github.com/sourcenetwork/lark"
homepage = "https://github.com/sourcenetwork/lark"
readme = "README.md"
keywords = ["database", "key-value", "lsm-tree", "storage", "embedded"]
categories = ["database-implementations"]

[features]
fuzzing = []

[dependencies]
crossbeam-skiplist = "0.1"
kovan = "0.1.19"
lz4_flex = "0.11"
snap = "1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
parking_lot = { version = "0.12", features = ["arc_lock"] }
lru = "0.18"
tracing = "0.1"
thiserror = "1.0"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["fs"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1"
tempfile = "3.8"

# tokio reads `cfg(loom)` itself and does not build when RUSTFLAGS sets
# it, so it is kept out of the loom dependency graph. Unchanged in every
# normal build.
[target.'cfg(not(loom))'.dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

# Model checker for the read-view publication protocol. Pulled in only
# under `RUSTFLAGS="--cfg loom"`, which is also the only configuration
# in which tests/loom_read_view.rs has any content.
[target.'cfg(loom)'.dev-dependencies]
loom = "0.7"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[profile.bench]
opt-level = 3

[[bench]]
name = "point_read"
harness = false

[[bench]]
name = "write_durable"
harness = false

[[bench]]
name = "write_buffered"
harness = false

[[bench]]
name = "scan"
harness = false

[[bench]]
name = "batch"
harness = false

[[bench]]
name = "transaction"
harness = false

[[bench]]
name = "large_value"
harness = false

[[bench]]
name = "memory"
harness = false

[[bench]]
name = "soak"
harness = false

[[bench]]
name = "size"
harness = false

[[bench]]
name = "collect"
harness = false
