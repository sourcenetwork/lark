# Test-runner settings shared by local runs and CI.
#
# nextest runs each test in its own process. That matters here for two
# reasons: a test that wedges cannot take the rest of the binary with
# it, and a test that assumes it owns its process (the crash harness
# re-executes itself) behaves the same way locally and in CI.

[profile.default]
# A test that stops making progress must fail, not hang. `cargo test`
# has no such bound: a deadlocked test holds the job until the whole
# workflow times out, which reports a scheduling problem instead of the
# defect. Terminating after two periods turns that into a named failure.
slow-timeout = { period = "60s", terminate-after = 5 }
# A test that fails because a sibling saturated the machine is noise;
# one that fails twice in a row is not.
retries = 0
failure-output = "immediate-final"
status-level = "fail"

[profile.ci]
inherits = "default"
# CI runners are slower and noisier than a workstation, so the bound is
# looser, but it is still a bound.
slow-timeout = { period = "120s", terminate-after = 5 }
retries = 1
final-status-level = "flaky"

# Windows leg of the test matrix.
#
# Windows is in the matrix for the code only it runs: `src/env/std_env.rs`
# takes different paths for positioned reads and directory sync, there is
# no `rustix`, `src/env/db_lock.rs` has a whole separate implementation,
# and the filesystem has semantics no unix has, notably that a file
# unlinked while a handle is open stays delete-pending under its own name.
# Those are worth a matrix leg.
#
# What is not worth one is re-running the long concurrency and corruption
# soaks. Their subject is engine logic, which is identical on every
# platform and already covered by the ubuntu and macos legs, and their
# cost is dominated by durable operations that this runner serves about
# two orders of magnitude slower than a Linux tmpfs. Together they were
# most of a 45 minute job.
#
# Everything else still runs here, including every corruption, recovery,
# lifecycle and public-API test.
#
# THE STANDING RULE: a heavy test does not run on Windows. "Heavy" means a
# soak, a hammer, a multi-second concurrency or corruption sweep, or anything
# whose cost is dominated by durable operations rather than by the logic it
# checks. Such a test belongs in a binary whose name starts with
# `adversarial_`, `adv_`, `soak_` or `heavy_`, which this filter drops by
# construction, so a new one is excluded without anyone remembering to edit
# the list below. Name it otherwise and it must be listed explicitly.
#
# The reason is not that Windows matters less. It is that this leg exists for
# the code only Windows runs, and a soak's subject is engine logic that is
# identical everywhere and already covered twice.
[profile.windows]
inherits = "ci"
default-filter = """
    not (
        binary(/^(adversarial_|adv_|soak_|heavy_)/)
        or binary(mvcc_invariants)
        or binary(read_view_hammer)
        or binary(read_view_chaos_workload)
        or binary(scan_read_horizon_ordering)
        or binary(group_commit_and_arena_memtable)
        or binary(sstable_metadata_scan_get_agreement)
        or binary(resource_limits)
        or test(=concurrency::writer_compactor_contention_soak)
        or test(=concurrency::snapshot_never_observes_a_torn_batch)
        or test(/^engine::block_cache::adversarial::/)
        or test(=rate_limiter::tests::ten_mb_through_one_mbps_takes_at_least_nine_seconds)
        or test(=every_publisher_of_the_read_view_running_at_once_stays_live)
        or test(=every_bit_flip_in_the_manifest_stops_replay_without_inventing_data)
    )
"""
